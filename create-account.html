<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account — StartRight Corporate Services</title>
<meta name="description" content="Create your StartRight client account.">
<link rel="icon" type="image/png" href="assets/img/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var d=document.documentElement;d.dataset.theme=localStorage.getItem('theme')||'light';d.dir=localStorage.getItem('dir')||'ltr'}catch(e){}</script>
<script defer src="assets/js/main.js"></script>
<script defer src="assets/js/auth.js"></script>
</head>
<body data-page="register" data-layout="auth">
<div id="auth-nav"></div>
<main class="auth"><section class="auth-img"><div class="bgslot b2" aria-hidden="true"><img src="assets/images/pexels-photo-9480122.jpeg" alt="" loading="eager" decoding="async"></div><div><span class="eyebrow">Client portal</span><h2>Start your company journey <em>the right way</em></h2><ul class="cl"><li>Free account with dashboard access</li><li>Secure document uploads</li><li>Reminders for every filing</li></ul></div></section><section class="auth-form"><div class="auth-box"><h1>Create your account</h1><p>Set up your client account in a minute.</p><form id="authform" novalidate><div class="field"><label for="name">Full name</label><input id="name" type="text" autocomplete="name"><span class="err" id="name-e"></span></div><div class="field"><label for="company">Company or startup name</label><input id="company" type="text" autocomplete="organization"><span class="err" id="company-e"></span></div><div class="field"><label for="email">Work email</label><input id="email" type="email" autocomplete="email"><span class="err" id="email-e"></span></div><div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel"><span class="err" id="phone-e"></span></div><div class="field"><label for="password">Password</label><div class="pw"><input id="password" type="password" autocomplete="new-password"><button type="button" aria-label="Show password"></button></div><span class="err" id="password-e"></span></div><div class="field"><label for="confirm">Confirm password</label><div class="pw"><input id="confirm" type="password" autocomplete="new-password"><button type="button" aria-label="Show password"></button></div><span class="err" id="confirm-e"></span></div><label class="agree"><input type="checkbox" id="terms"><span>I agree to the Terms of Service and Privacy Policy.</span></label><span class="err" id="terms-e" style="display:block;margin:-10px 0 12px;color:#B3261E;font-size:.82rem"></span><button class="btn btn-p" type="submit">Create account</button><div class="msg" id="a-msg" role="status" style="margin-top:16px"></div></form><p class="auth-alt">Already have an account? <a href="login.html">Sign in</a></p></div></section></main>
</body></html>
